# =============================================================================
#  hyprpaper
#  https://wiki.hypr.land/hypr-ecosystem/user/hyprpaper/
#
#  The old `preload =` / `wallpaper = MON,path` syntax was REMOVED in the
#  hyprtoolkit rewrite. Wallpapers are anonymous `wallpaper { }` blocks now,
#  and there is no separate preload step. An old-syntax file does not warn,
#  it just leaves you staring at the Hyprland mascot.
#
#  The old file also hardcoded /home/artars/wallpaper.jpg, which is broken for
#  every other user. `~` is expanded here.
# =============================================================================

# Fallback for every monitor: leave `monitor` empty.
wallpaper {
    monitor  =
    path     = ~/wallpaper.jpg
    fit_mode = cover
}

# Per-monitor override. Uncomment and adjust if you want a different image on
# a specific output (names come from `hyprctl monitors`).
# wallpaper {
#     monitor  = DP-1
#     path     = ~/wallpaper-dp1.jpg
#     fit_mode = cover
# }

# Point `path` at a directory to rotate through it:
# wallpaper {
#     monitor   =
#     path      = ~/Pictures/walls
#     fit_mode  = cover
#     timeout   = 900
#     order     = random
#     recursive = true
# }

# Hyprland's own splash text is already disabled via misc.disable_splash_rendering
# in conf/looks.lua, but hyprpaper draws its own and needs its own switch.
splash = false
ipc    = true
