# =============================================================================
#  hyprsunset — blue light filter + gamma
#  https://wiki.hypr.land/hypr-ecosystem/user/hyprsunset/
#
#  The old file was out of range and effectively a no-op:
#
#    max-gamma = 1200      <- absolute maximum is 200
#    profile { time = 00:00; temperature = 6500; gamma = 12 }
#
#  6500K is neutral daylight, so the single profile changed nothing, and
#  gamma = 12 is far outside the sane range (1.0 is normal).
#
#  Profiles activate at their `time` and reset everything the previous one
#  set. On startup hyprsunset applies whichever profile is current.
# =============================================================================

# 100 is normal. Raise only if you drive gamma over IPC. Hard ceiling is 200.
max-gamma = 100

# Daytime: neutral, filter off.
profile {
    time        = 07:00
    temperature = 6500
    gamma       = 1.0
}

# Evening: warm.
profile {
    time        = 20:00
    temperature = 4500
    gamma       = 1.0
}

# Night: warmer and slightly dimmer than the panel's own minimum.
profile {
    time        = 23:00
    temperature = 3500
    gamma       = 0.9
}
